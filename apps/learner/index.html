<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas GO1</title>
  <link rel="stylesheet" href="../../sdk/themes/tokens.css">
  <link rel="stylesheet" href="../../sdk/components/components.css">
  <link rel="stylesheet" href="../../sdk/components/concept-visuals.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#lessonRoot">Skip to lesson</a>
  <div class="atlas-shell">
    <header class="atlas-header">
      <div class="brand">✦ Atlas</div>
      <div class="toolbar">
        <button class="btn secondary" id="languageBtn" type="button">Español</button>
        <button class="btn secondary" id="themeBtn" type="button" aria-pressed="false">Dark mode</button>
        <button class="btn secondary" id="textBtn" type="button" aria-pressed="false">Bigger text</button>
        <button class="btn secondary" id="motionBtn" type="button" aria-pressed="false">Reduce motion</button>
      </div>
    </header>
    <main class="lesson-panel" id="lessonRoot" tabindex="-1" aria-busy="true"></main>
    <footer class="atlas-footer">
      <label class="lesson-picker" for="lessonSelect"><span class="sr-only" id="lessonSelectLabel">Choose a lesson</span><select id="lessonSelect" class="select" aria-labelledby="lessonSelectLabel">
        <option value="../../curriculum/lessons/lesson001.json" data-en="Lesson 001 — How many more?" data-es="Lección 001 — ¿Cuántos más?">Lesson 001 — How many more?</option>
        <option value="../../curriculum/lessons/lesson002.json" data-en="Lesson 002 — How many fewer?" data-es="Lección 002 — ¿Cuántos menos?">Lesson 002 — How many fewer?</option>
        <option value="../../curriculum/lessons/lesson003.json" data-en="Lesson 003 — Difference" data-es="Lección 003 — Diferencia">Lesson 003 — Difference</option>
        <option value="../../curriculum/lessons/lesson004.json" data-en="Lesson 004 — Find the compared amount" data-es="Lección 004 — Encuentra la cantidad comparada">Lesson 004 — Find the compared amount</option>
        <option value="../../curriculum/lessons/lesson005.json" data-en="Prototype 005 — Share equally" data-es="Prototipo 005 — Repartir por igual">Prototype 005 — Share equally</option>
        <option value="../../curriculum/lessons/lesson006.json" data-en="Prototype 006 — Name equal parts" data-es="Prototipo 006 — Nombrar partes iguales">Prototype 006 — Name equal parts</option>
        <option value="../../curriculum/lessons/lesson007.json" data-en="Prototype 007 — Percent means per hundred" data-es="Prototipo 007 — Porcentaje significa por cada cien">Prototype 007 — Percent means per hundred</option>
      </select></label>
      <a class="btn secondary" id="memoryAssetsLink" href="../../assets/memory/" style="display:inline-flex;align-items:center;text-decoration:none">Memory practice</a>
      <button class="btn secondary" id="analyticsBtn" type="button">Learning summary</button>
    </footer>
  </div>
  <div class="modal" id="analyticsModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="analyticsTitle">
      <span class="badge" id="progressLabel">Progress</span>
      <h1 id="analyticsTitle">Learning Summary</h1>
      <div class="analytics-grid" id="analyticsSummary"></div>
      <div class="analytics-list" id="analyticsDetails"></div>
      <button class="btn primary" id="closeAnalytics" type="button">Close</button>
    </div>
  </div>
  <script type="module" src="../../engine/lessonEngine.js?v=1.8"></script>
</body>
</html>
